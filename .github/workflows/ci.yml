name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test

  # Builds the storefront and drives it against the real API on a seeded in-memory database.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: storefront

      - uses: actions/checkout@v4
        with:
          repository: Shamsmedhat/fashion-e-commerce-backend
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            storefront/yarn.lock
            backend/yarn.lock

      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('backend/yarn.lock') }}

      - run: yarn install --frozen-lockfile
        working-directory: backend
      - run: node test-support/ensure-mongodb-binary.js
        working-directory: backend

      - run: yarn install --frozen-lockfile
        working-directory: storefront
      - run: npx playwright install --with-deps chromium
        working-directory: storefront

      - run: yarn test:e2e
        working-directory: storefront
        env:
          BACKEND_DIR: ../backend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: storefront/test-results
